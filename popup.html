<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 210px;
      padding: 14px;
      font-family: sans-serif;
      background: #1e1e2e;
      color: white;
      margin: 0;
    }
    h4 {
      margin: 0 0 10px 0;
      font-size: 13px;
      color: #aaa;
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    button {
      width: 100%;
      padding: 9px;
      margin: 4px 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }
    #setBtn    { background: #ff6b35; color: white; }
    #goBtn     { background: #1a73e8; color: white; }
    #removeBtn { background: #444; color: #ccc; }
    p {
      font-size: 10px;
      color: #666;
      margin-top: 10px;
      text-align: center;
      line-height: 1.5;
    }
    #status {
      font-size: 11px;
      color: #0f0;
      text-align: center;
      margin-top: 6px;
      min-height: 14px;
    }
    #topBtn { background: #2d6a4f; color: white; }
    #botBtn { background: #2d6a4f; color: white; }
  </style>
</head>
<body>
  <h4>Chat Bookmark</h4>
  <button id="setBtn">[+] Set Bookmark (Alt+B)</button>
  <button id="goBtn">[>] Go to Bookmark (Alt+G)</button>
  <button id="removeBtn">[x] Remove Bookmark (Alt+R)</button>
  <hr style="border-color:#333; margin: 8px 0;">
  <button id="topBtn">[^] Go to Top (Alt+T)</button>
  <button id="botBtn">[v] Go to Bottom (Alt+D)</button>
  <div id="status"></div>
  <p>Hover mouse where you want<br/>the bookmark, then press Alt+B</p>
  <script src="popup.js"></script>
</body>
</html>
