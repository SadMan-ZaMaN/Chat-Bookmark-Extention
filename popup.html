<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 200px; padding: 12px; font-family: sans-serif; }
    button {
      width: 100%; padding: 8px; margin: 4px 0;
      border: none; border-radius: 8px;
      cursor: pointer; font-size: 14px; font-weight: bold;
    }
    #setBtn { background: #ff6b35; color: white; }
    #goBtn  { background: #1a73e8; color: white; }
    p { font-size: 11px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>
  <button id="setBtn">📍 Set Bookmark (Alt+B)</button>
  <button id="goBtn">🔁 Go to Bookmark (Alt+G)</button>
  <p>Works on Claude, ChatGPT, Gemini, DeepSeek</p>
  <script>
    function send(action) {
      chrome.tabs.query({active: true, currentWindow: true}, tabs => {
        chrome.scripting.executeScript({
          target: { tabId: tabs[0].id },
          files: ['content.js']
        }, () => {
          chrome.tabs.sendMessage(tabs[0].id, { action });
        });
      });
    }
    document.getElementById('setBtn').onclick = () => send('set');
    document.getElementById('goBtn').onclick = () => send('go');
  </script>
</body>
</html>
